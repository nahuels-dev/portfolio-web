        hint: Número único. Los proyectos se ordenan de menor a mayor.
        pattern:
          - ^\d+$
          - Usá sólo números.
      - name: slug
        label: Ruta
        widget: string
        pattern:
          - ^[a-z0-9]+(?:-[a-z0-9]+)*$
          - Usá minúsculas, números y guiones.
        hint: Ruta única del proyecto. Cambiarla modifica sus enlaces públicos.
      - name: name
        label: Nombre
        widget: string
      - name: category
        label: Categoría
        widget: object
