            label: Español
            widget: string
          - name: en
            label: English
            widget: string
      - name: description
        label: Resumen
        widget: object
        fields:
          - name: es
            label: Español
            widget: text
          - name: en
            label: English
            widget: text
      - name: tech
        label: Tecnologías
        widget: list
        min: 1
        field:
          name: item
          label: Texto
          widget: string
      - name: image
        label: Imagen principal
        widget: image
        choose_url: false
      - name: href
        label: Sitio web
        widget: string
        required: false
        pattern: &a1
          - ^(https?://[^\s]+)?$
          - Usá una URL http o https.
      - name: repository
        label: Repositorio
        widget: string
        required: false
        pattern: *a1
      - name: label
        label: Etiqueta del proyecto
        widget: string
      - name: role
        label: Mi participación
        widget: object
        fields:
          - name: es
            label: Español
            widget: string
          - name: en
            label: English
            widget: string
      - name: copy
        label: Contenido
        widget: object
        fields:
          - name: es
            label: Español
            widget: object
            fields: &a2
              - name: intro
                label: Introducción
                widget: text
              - name: overview
                label: Contexto
                widget: text
              - name: challenge
                label: Desafío
                widget: text
              - name: solution
                label: Solución
                widget: text
              - name: features
                label: Decisiones y desarrollo
                widget: list
                min: 1
                fields: &a3
                  - name: title
                    label: Título
                    widget: string
                  - name: text
                    label: Texto
                    widget: text
          - name: en
            label: English
            widget: object
            fields: *a2
      - name: gallery
        label: Galería
        widget: list
        min: 0
        fields:
          - name: src
            label: Imagen
            widget: image
            choose_url: false
          - name: alt
            label: Texto alternativo
            widget: object
            fields:
              - name: es
                label: Español
                widget: string
              - name: en
                label: English
                widget: string
          - name: caption
            label: Pie de imagen
            widget: object
            fields:
              - name: es
                label: Español
                widget: string
              - name: en
                label: English
                widget: string
        required: false
